apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidekiq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sidekiq
  template:
    metadata:
      labels:
        app: sidekiq
    spec:
      containers:
      - name: sidekiq
        image: rails-app:latest
        imagePullPolicy: IfNotPresent
        command: ["bundle", "exec", "sidekiq"]
        env:
        - name: SECRET_KEY_BASE
          valueFrom:
            secretKeyRef:
              name: rails-secret
              key: SECRET_KEY_BASE
        - name: DATABASE_HOST
          value: "postgres"
        - name: DATABASE_USER
          value: "postgres"
        - name: DATABASE_PASSWORD
          value: "postgres"
        - name: DATABASE_NAME
          value: "calendar_development"
        - name: REDIS_URL
          value: "redis://redis:6379/0"
